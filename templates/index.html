<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI智能招聘管理系统</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
/* ===== Reset & Base ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100vh}
a{color:#4f46e5;text-decoration:none}
/* ===== Layout ===== */
.app-header{background:linear-gradient(135deg,#1e1b4b,#312e81);color:#fff;padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(0,0,0,.15);position:sticky;top:0;z-index:100}
.app-header h1{font-size:20px;font-weight:600;display:flex;align-items:center;gap:10px}
.app-header h1 i{color:#a5b4fc}
.header-actions{display:flex;align-items:center;gap:16px}
.header-actions span{font-size:13px;color:#c7d2fe}
.stats-badge{background:rgba(255,255,255,.15);padding:6px 14px;border-radius:20px;font-size:13px}
.app-container{max-width:1400px;margin:0 auto;padding:24px 20px}
.page-section{margin-bottom:28px}
.section-title{font-size:16px;font-weight:600;color:#1a1a2e;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.section-title .badge{background:#e0e7ff;color:#4338ca;font-size:12px;padding:2px 10px;border-radius:12px}
/* ===== Department Cards ===== */
.dept-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-bottom:28px}
.dept-card{background:#fff;border-radius:12px;padding:20px 24px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;transition:all .2s;border:2px solid transparent;position:relative;overflow:hidden}
.dept-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1);transform:translateY(-1px)}
.dept-card.active{border-color:#4f46e5;background:#f8f7ff}
.dept-card .dept-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:12px}
.dept-card.tech .dept-icon{background:#ede9fe;color:#7c3aed}
.dept-card.product .dept-icon{background:#fce7f3;color:#db2777}
.dept-card.market .dept-icon{background:#dbeafe;color:#2563eb}
.dept-card h3{font-size:16px;font-weight:600;margin-bottom:4px}
.dept-card .dept-count{font-size:13px;color:#6b7280;margin-bottom:12px}
.dept-stats{display:flex;gap:16px;flex-wrap:wrap}
.dept-stat{display:flex;align-items:center;gap:6px;font-size:13px;color:#374151}
.dept-stat strong{font-size:18px;color:#1a1a2e;font-weight:700}
.dept-stat .label{color:#6b7280;font-size:12px}
.dept-card .active-indicator{position:absolute;top:0;left:0;width:4px;height:100%;background:#4f46e5;display:none}
.dept-card.active .active-indicator{display:block}
.dept-card .arrow{position:absolute;right:16px;top:20px;color:#c7cbd1;font-size:18px}
/* ===== Main Content Layout ===== */
.main-content{display:grid;grid-template-columns:1fr 320px;gap:20px}
@media(max-width:1024px){.main-content{grid-template-columns:1fr}}
/* ===== Candidate List ===== */
.candidate-list{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden}
.list-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #e5e7eb;flex-wrap:wrap;gap:12px}
.list-header .left{display:flex;align-items:center;gap:12px}
.list-header .left h2{font-size:16px;font-weight:600}
.list-filters{display:flex;gap:8px;flex-wrap:wrap}
.list-filters select,.list-filters input{padding:6px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;background:#fff;outline:none}
.list-filters select:focus,.list-filters input:focus{border-color:#4f46e5;box-shadow:0 0 0 2px rgba(79,70,229,.1)}
.candidate-item{display:flex;align-items:center;padding:14px 20px;border-bottom:1px solid #f3f4f6;cursor:pointer;transition:background .15s;gap:14px}
.candidate-item:hover{background:#f9fafb}
.candidate-item:last-child{border-bottom:none}
.candidate-avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;flex-shrink:0;color:#fff}
.candidate-avatar.male{background:linear-gradient(135deg,#6366f1,#818cf8)}
.candidate-avatar.female{background:linear-gradient(135deg,#ec4899,#f472b6)}
.candidate-info{flex:1;min-width:0}
.candidate-info .name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.candidate-info .name .stage-tag{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500}
.stage-tag.resume{background:#fef3c7;color:#92400e}
.stage-tag.first{background:#dbeafe;color:#1e40af}
.stage-tag.second{background:#ede9fe;color:#5b21b6}
.stage-tag.final{background:#fce7f3;color:#9d174d}
.stage-tag.offer{background:#d1fae5;color:#065f46}
.candidate-info .sub{font-size:12px;color:#6b7280;margin-top:2px}
.candidate-tags{display:flex;gap:4px;flex-wrap:wrap}
.candidate-tags .tag{font-size:11px;background:#f3f4f6;color:#4b5563;padding:2px 8px;border-radius:4px}
.candidate-score{text-align:center;min-width:56px}
.candidate-score .num{font-size:18px;font-weight:700}
.candidate-score .num.high{color:#059669}
.candidate-score .num.mid{color:#d97706}
.candidate-score .num.low{color:#dc2626}
.candidate-score .lbl{font-size:11px;color:#6b7280}
/* ===== Empty State ===== */
.empty-state{text-align:center;padding:48px 20px;color:#6b7280}
.empty-state i{font-size:48px;color:#d1d5db;margin-bottom:12px}
.empty-state p{font-size:14px}
/* ===== Weights Panel ===== */
.weights-panel{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:20px;position:sticky;top:88px}
.weights-panel h3{font-size:15px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.weights-panel .sub{font-size:12px;color:#6b7280;margin-bottom:16px}
.weight-item{margin-bottom:16px}
.weight-header{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.weight-header .wl{color:#374151}
.weight-header .wv{font-weight:600;color:#4f46e5}
.weight-slider{width:100%;-webkit-appearance:none;height:6px;border-radius:3px;background:#e5e7eb;outline:none}
.weight-slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#4f46e5;cursor:pointer;box-shadow:0 1px 4px rgba(79,70,229,.3)}
.weight-slider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#4f46e5;cursor:pointer;border:none}
.weight-total{text-align:center;padding:12px;border-radius:8px;margin:12px 0;font-size:13px}
.weight-total.ok{background:#f0fdf4;color:#166534}
.weight-total.warn{background:#fef2f2;color:#991b1b}
.btn-apply{width:100%;padding:10px;border:none;border-radius:8px;background:#4f46e5;color:#fff;font-size:14px;font-weight:500;cursor:pointer;transition:background .2s}
.btn-apply:hover{background:#4338ca}
.btn-apply:disabled{background:#9ca3af;cursor:not-allowed}
.btn-reset{width:100%;padding:8px;border:1px solid #d1d5db;border-radius:8px;background:transparent;color:#6b7280;font-size:13px;cursor:pointer;margin-top:8px;transition:all .2s}
.btn-reset:hover{background:#f3f4f6;color:#374151}
/* ===== Detail Modal ===== */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal-content{background:#fff;border-radius:16px;width:100%;max-width:720px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:modalIn .25s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid #e5e7eb;position:sticky;top:0;background:#fff;z-index:1}
.modal-header h2{font-size:18px;display:flex;align-items:center;gap:10px}
.modal-close{width:32px;height:32px;border:none;background:#f3f4f6;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#6b7280;transition:all .2s}
.modal-close:hover{background:#e5e7eb;color:#1a1a2e}
.modal-body{padding:24px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
@media(max-width:600px){.detail-grid{grid-template-columns:1fr}}
.detail-field{}
.detail-field .dl{font-size:12px;color:#6b7280;margin-bottom:2px}
.detail-field .dv{font-size:14px;font-weight:500;color:#1a1a2e}
.section-divider{border:none;border-top:1px solid #e5e7eb;margin:20px 0}
.summary-card{background:#f8f7ff;border-radius:10px;padding:16px;margin-bottom:16px;border-left:4px solid #4f46e5}
.summary-card .sc-title{font-size:13px;font-weight:600;color:#4338ca;margin-bottom:6px}
.summary-card .sc-text{font-size:13px;color:#374151;line-height:1.7}
.score-bars{margin:16px 0}
.score-bar-item{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.score-bar-item .sbl{font-size:13px;color:#374151;width:80px;flex-shrink:0;text-align:right}
.score-bar-item .sbb{flex:1;height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden}
.score-bar-item .sbb .fill{height:100%;border-radius:4px;transition:width .4s ease}
.score-bar-item .sbv{font-size:13px;font-weight:600;width:60px;text-align:right}
.interview-note{background:#f9fafb;border-radius:8px;padding:12px 16px;margin-bottom:8px;border-left:3px solid #6366f1}
.interview-note .note-header{display:flex;justify-content:space-between;font-size:12px;color:#6b7280;margin-bottom:4px}
.interview-note .note-header .verdict{padding:2px 8px;border-radius:10px;font-weight:500;font-size:11px}
.verdict.pass{background:#d1fae5;color:#065f46}
.verdict.pending{background:#fef3c7;color:#92400e}
.interview-note .note-text{font-size:13px;color:#374151;line-height:1.6}
.exp-item{margin-bottom:12px;padding:12px;background:#f9fafb;border-radius:8px}
.exp-item .exp-company{font-weight:600;font-size:14px}
.exp-item .exp-role{font-size:12px;color:#6b7280;margin:2px 0}
.exp-item .exp-desc{font-size:13px;color:#374151}
/* ===== AI Chat ===== */
.chat-fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border:none;cursor:pointer;box-shadow:0 4px 16px rgba(79,70,229,.35);display:flex;align-items:center;justify-content:center;z-index:150;transition:all .25s;font-size:24px}
.chat-fab:hover{transform:scale(1.08);box-shadow:0 6px 24px rgba(79,70,229,.45)}
.chat-fab .badge-dot{position:absolute;top:-2px;right:-2px;width:14px;height:14px;background:#ef4444;border-radius:50%;border:2px solid #fff}
.chat-panel{position:fixed;bottom:90px;right:24px;width:380px;max-height:540px;background:#fff;border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,.18);z-index:149;display:none;flex-direction:column;overflow:hidden;animation:slideUp .25s ease}
.chat-panel.show{display:flex}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.chat-header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.chat-header h3{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.chat-header .chat-close{background:rgba(255,255,255,.2);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
.chat-messages{flex:1;overflow-y:auto;padding:14px 16px;min-height:200px;max-height:340px;background:#f8f9fb}
.chat-msg{margin-bottom:12px;display:flex;gap:8px}
.chat-msg.bot{}
.chat-msg.user{flex-direction:row-reverse}
.chat-msg .bubble{max-width:85%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.6;white-space:pre-wrap}
.chat-msg.bot .bubble{background:#fff;color:#1a1a2e;box-shadow:0 1px 4px rgba(0,0,0,.06);border-bottom-left-radius:4px}
.chat-msg.user .bubble{background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;border-bottom-right-radius:4px}
.chat-msg .avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.chat-msg.bot .avatar{background:#e0e7ff;color:#4338ca}
.chat-msg.user .avatar{background:#c7d2fe;color:#3730a3}
.chat-suggestions{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px;border-top:1px solid #e5e7eb}
.chat-suggestions button{font-size:12px;padding:4px 12px;border:1px solid #d1d5db;border-radius:14px;background:#fff;color:#4b5563;cursor:pointer;transition:all .15s}
.chat-suggestions button:hover{background:#f3f4f6;border-color:#9ca3af}
.chat-input-wrap{display:flex;padding:10px 14px;border-top:1px solid #e5e7eb;gap:8px;background:#fff}
.chat-input-wrap input{flex:1;padding:8px 14px;border:1px solid #d1d5db;border-radius:20px;outline:none;font-size:13px}
.chat-input-wrap input:focus{border-color:#4f46e5}
.chat-input-wrap button{width:36px;height:36px;border-radius:50%;border:none;background:#4f46e5;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s;flex-shrink:0}
.chat-input-wrap button:hover{background:#4338ca}
/* ===== Tools (Resume & Interview Extract) ===== */
.tools-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px}
@media(max-width:768px){.tools-row{grid-template-columns:1fr}}
.tool-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tool-card h3{font-size:14px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.tool-card textarea{width:100%;min-height:80px;padding:10px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;resize:vertical;outline:none;font-family:inherit}
.tool-card textarea:focus{border-color:#4f46e5;box-shadow:0 0 0 2px rgba(79,70,229,.1)}
.tool-card .btn-tool{margin-top:8px;padding:8px 18px;border:none;border-radius:6px;background:#4f46e5;color:#fff;font-size:13px;cursor:pointer;transition:background .2s}
.tool-card .btn-tool:hover{background:#4338ca}
.tool-result{background:#f9fafb;border-radius:8px;padding:12px;margin-top:10px;font-size:13px;line-height:1.6;max-height:200px;overflow-y:auto}
.tool-result pre{margin:0;white-space:pre-wrap;word-break:break-all}
/* ===== Funnel Section ===== */
.funnel-section{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:28px}
.funnel-container{display:flex;align-items:flex-end;gap:12px;padding:12px 0;height:160px}
.funnel-bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}
.funnel-bar .bar{width:100%;max-width:100px;border-radius:6px 6px 0 0;transition:height .5s ease;min-height:4px}
.funnel-bar .bar-label{font-size:12px;color:#6b7280;text-align:center}
.funnel-bar .bar-value{font-size:14px;font-weight:700;color:#1a1a2e}
/* ===== Loading ===== */
.loading{display:inline-block;width:16px;height:16px;border:2px solid #e5e7eb;border-top-color:#4f46e5;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ===== Responsive ===== */
@media(max-width:768px){
  .app-container{padding:12px}
  .dept-grid{grid-template-columns:1fr}
  .chat-panel{width:calc(100vw - 32px);right:16px;bottom:84px;max-height:460px}
  .list-header{flex-direction:column;align-items:stretch}
}
/* ===== Notifications ===== */
.toast{position:fixed;top:80px;right:24px;z-index:300;background:#065f46;color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.15);display:none;animation:slideIn .3s ease}
.toast.show{display:flex;align-items:center;gap:8px}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.toast i{font-size:18px}
</style>
</head>
<body>
<!-- Header -->
<header class="app-header">
  <h1><i data-lucide="brain-circuit"></i> AI智能招聘管理系统</h1>
  <div class="header-actions">
    <span class="stats-badge" id="headerStats">加载中...</span>
  </div>
</header>

<div class="app-container">
  <!-- Tools: Resume & Interview Extract -->
  <div class="tools-row">
    <div class="tool-card">
      <h3><i data-lucide="file-text" style="color:#7c3aed" width="18"></i> 简历智能提取</h3>
      <textarea id="resumeInput" placeholder="粘贴简历文本...&#10;例如：姓名：张三&#10;学历：本科&#10;北京大学&#10;3年Java开发经验..."></textarea>
      <button class="btn-tool" onclick="extractResume()"><i data-lucide="wand-2" width="14"></i> AI提取</button>
      <div class="tool-result" id="resumeResult" style="display:none"></div>
    </div>
    <div class="tool-card">
      <h3><i data-lucide="message-square" style="color:#db2777" width="18"></i> 面评智能提取</h3>
      <textarea id="interviewInput" placeholder="粘贴面试官面评...&#10;例如：候选人技术栈扎实，分布式经验丰富，沟通表达清晰，建议通过。"></textarea>
      <button class="btn-tool" onclick="extractInterview()"><i data-lucide="wand-2" width="14"></i> AI提取</button>
      <div class="tool-result" id="interviewResult" style="display:none"></div>
    </div>
  </div>

  <!-- Funnel -->
  <div class="funnel-section">
    <div class="section-title"><i data-lucide="funnel" width="18"></i> 招聘漏斗 <span class="badge" id="funnelBadge"></span></div>
    <div class="funnel-container" id="funnelChart"></div>
  </div>

  <!-- Department Overview -->
  <div class="page-section">
    <div class="section-title"><i data-lucide="layout-dashboard" width="18"></i> 部门总览地图</div>
    <div class="dept-grid" id="deptGrid"></div>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="candidate-list" id="candidateList">
      <div class="list-header">
        <div class="left">
          <h2><i data-lucide="users" width="18"></i> <span id="listTitle">全部候选人</span></h2>
          <span class="badge" id="candidateCount">0人</span>
        </div>
        <div class="list-filters">
          <input type="text" placeholder="搜索姓名/职位/技能..." id="searchInput" oninput="debouncedLoad()" style="width:160px">
          <select id="stageFilter" onchange="loadCandidates()">
            <option value="">全部阶段</option>
            <option value="简历初筛">简历初筛</option>
            <option value="初试">初试</option>
            <option value="复试">复试</option>
            <option value="终面">终面</option>
            <option value="offer">Offer</option>
          </select>
          <select id="sortBy" onchange="loadCandidates()">
            <option value="score_desc">匹配度↓</option>
            <option value="score_asc">匹配度↑</option>
            <option value="work_years_desc">经验↓</option>
            <option value="name">姓名</option>
          </select>
        </div>
      </div>
      <div id="candidateItems">
        <div class="empty-state"><i data-lucide="loader-circle" width="48"></i><p>加载中...</p></div>
      </div>
    </div>

    <!-- Weights Panel -->
    <div class="weights-panel" id="weightsPanel">
      <h3><i data-lucide="sliders-horizontal" width="16"></i> 评分权重调节</h3>
      <p class="sub" id="deptWeightLabel">选择部门查看权重</p>
      <div id="weightItems"></div>
      <div class="weight-total" id="weightTotal"></div>
      <button class="btn-apply" id="applyWeights" onclick="applyWeights()" disabled>应用权重</button>
      <button class="btn-reset" id="resetWeights" onclick="resetWeights()">恢复默认</button>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2><i data-lucide="user" width="20"></i> <span id="modalName">候选人详情</span></h2>
      <button class="modal-close" onclick="closeModal()"><i data-lucide="x" width="18"></i></button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- AI Chat -->
<button class="chat-fab" id="chatFab" onclick="toggleChat()">
  <i data-lucide="bot" width="26"></i>
  <span class="badge-dot" id="chatDot" style="display:none"></span>
</button>

<div class="chat-panel" id="chatPanel">
  <div class="chat-header">
    <h3><i data-lucide="bot" width="18"></i> AI招聘助手</h3>
    <button class="chat-close" onclick="toggleChat()"><i data-lucide="x" width="18"></i></button>
  </div>
  <div class="chat-messages" id="chatMessages">
    <div class="chat-msg bot">
      <div class="avatar"><i data-lucide="bot" width="16"></i></div>
      <div class="bubble">你好！我是AI招聘助手，可以帮你：</div>
    </div>
    <div class="chat-msg bot">
      <div class="avatar"><i data-lucide="bot" width="16"></i></div>
      <div class="bubble">• 搜索候选人：如"找技术部Java开发"<br>• 查询统计：如"本月招聘数据"<br>• 对比分析：如"对比得分最高的两位"<br>• 查看进度：如"产品经理到终面的有几人"</div>
    </div>
  </div>
  <div class="chat-suggestions" id="chatSuggestion"></div>
  <div class="chat-input-wrap">
    <input type="text" id="chatInput" placeholder="输入问题..." onkeydown="if(event.key==='Enter')sendChat()">
    <button onclick="sendChat()"><i data-lucide="send" width="16"></i></button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"><i data-lucide="check-circle" width="18"></i> <span id="toastMsg"></span></div>

<script>
lucide.createIcons();

let currentDept = null;
let selectedWeights = {};
let hasWeightChanges = false;

// ===== Toast =====
function showToast(msg){const t=document.getElementById('toast');document.getElementById('toastMsg').textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}

// ===== Debounce =====
let debounceTimer;
function debouncedLoad(){clearTimeout(debounceTimer);debounceTimer=setTimeout(loadCandidates,300)}

// ===== Funnel =====
async function loadFunnel(){
  try{
    const r=await fetch('/api/stats/funnel');const data=await r.json();
    const container=document.getElementById('funnelChart');container.innerHTML='';
    const maxCount=Math.max(...data.map(d=>d.count),1);
    document.getElementById('funnelBadge').textContent=`${data.reduce((a,b)=>a+b.count,0)}人`;
    const colors={0:'#93c5fd',1:'#818cf8',2:'#a78bfa',3:'#f472b6',4:'#34d399'};
    data.forEach((d,i)=>{
      const div=document.createElement('div');div.className='funnel-bar';
      const bar=document.createElement('div');bar.className='bar';
      const pct=i===0?100:Math.max(d.count/maxCount*100,8);
      bar.style.height=pct+'%';bar.style.background=colors[i]||'#93c5fd';
      const val=document.createElement('div');val.className='bar-value';val.textContent=d.count;
      const lbl=document.createElement('div');lbl.className='bar-label';lbl.textContent=d.stage;
      div.appendChild(val);div.appendChild(bar);div.appendChild(lbl);container.appendChild(div);
    });
  }catch(e){console.error('Funnel error:',e)}
}

// ===== Departments =====
async function loadDepartments(){
  try{
    const r=await fetch('/api/departments/overview');const data=await r.json();
    const grid=document.getElementById('deptGrid');grid.innerHTML='';
    Object.entries(data).forEach(([id,dept])=>{
      const card=document.createElement('div');
      card.className=`dept-card ${id}`+(currentDept===id?' active':'');
      card.onclick=()=>selectDept(id);
      const iconMap={tech:'laptop',product:'pie-chart',market:'trending-up'};
      const stagesHtml=Object.entries(dept.stages).map(([k,v])=>`<span class="dept-stat"><strong>${v}</strong><span class="label">${k}</span></span>`).join('');
      card.innerHTML=`
        <div class="active-indicator"></div>
        <div class="dept-icon"><i data-lucide="${iconMap[id]}" width="22"></i></div>
        <h3>${dept.name}</h3>
        <div class="dept-count">投递 ${dept.total} 人 · 平均匹配度 ${dept.avg_score}分 · 通过终面 ${dept.passed_count}人</div>
        <div class="dept-stats">${stagesHtml}</div>
        <div class="arrow"><i data-lucide="chevron-right" width="18"></i></div>
      `;
      grid.appendChild(card);
    });
    lucide.createIcons();
  }catch(e){console.error('Dept error:',e)}
}

function selectDept(deptId){
  currentDept=currentDept===deptId?null:deptId;
  loadDepartments();
  loadCandidates();
  loadWeights();
}

// ===== Candidates =====
async function loadCandidates(){
  try{
    const params=new URLSearchParams();const search=document.getElementById('searchInput').value;
    if(currentDept)params.set('dept',currentDept);
    const stage=document.getElementById('stageFilter').value;
    if(stage)params.set('stage',stage);
    params.set('sort_by',document.getElementById('sortBy').value);
    if(search)params.set('keyword',search);
    
    const r=await fetch(`/api/candidates?${params}`);const data=await r.json();
    const container=document.getElementById('candidateItems');const title=document.getElementById('listTitle');
    document.getElementById('candidateCount').textContent=`${data.length}人`;
    
    title.textContent=currentDept?document.querySelector(`.dept-card.${currentDept} h3`)?.textContent||'全部候选人':'全部候选人';
    
    if(data.length===0){
      container.innerHTML=`<div class="empty-state"><i data-lucide="search-x" width="48"></i><p>暂无匹配候选人</p></div>`;
      lucide.createIcons();return;
    }
    
    const stageColors={0:'resume',1:'first',2:'second',3:'final',4:'offer'};
    html='';
    data.forEach(c=>{
      const scoreClass=c.score>=85?'high':c.score>=70?'mid':'low';
      const sIdx={resume:0,first:1,second:2,final:3,offer:4}[c.stage]||0;
      html+=`
        <div class="candidate-item" onclick="openDetail(${c.id})">
          <div class="candidate-avatar ${c.gender==='男'?'male':'female'}">${c.name[0]}</div>
          <div class="candidate-info">
            <div class="name">${c.name}${c.age}岁 · ${c.education} · ${c.work_years}年经验
              <span class="stage-tag ${stageColors[sIdx]}">${c.stage}</span>
            </div>
            <div class="sub">${c.target_position} · ${c.dept_name} · ${c.school} · ${c.city}</div>
            <div class="candidate-tags">${c.skills.map(s=>`<span class="tag">${s}</span>`).join('')}</div>
          </div>
          <div class="candidate-score">
            <div class="num ${scoreClass}">${c.score}</div>
            <div class="lbl">匹配度</div>
          </div>
        </div>`;
    });
    container.innerHTML=html;lucide.createIcons();
  }catch(e){console.error('Candidates error:',e);document.getElementById('candidateItems').innerHTML='<div class="empty-state"><p>加载失败</p></div>'}
}

// ===== Detail Modal =====
async function openDetail(id){
  try{
    const r=await fetch(`/api/candidates/${id}`);const c=await r.json();
    document.getElementById('modalName').textContent=c.name;
    
    // Score bars
    const scoreBars=Object.entries(c.score_detail||{}).map(([label,data])=>{
      const pct=Math.min(data.score*100/100,100);
      const color=data.score>=85?'#059669':data.score>=70?'#d97706':'#dc2626';
      return `<div class="score-bar-item">
        <span class="sbl">${label}</span>
        <div class="sbb"><div class="fill" style="width:${pct}%;background:${color}"></div></div>
        <span class="sbv" style="color:${color}">${data.score}分</span>
      </div>`;
    }).join('');
    
    // Interview notes
    const notes=(c.interview_notes||[]).map(n=>{
      const vClass=n.verdict==='通过'||n.verdict==='offer'?'pass':'pending';
      return `<div class="interview-note">
        <div class="note-header"><span>${n.round} · ${n.interviewer}</span><span class="verdict ${vClass}">${n.verdict}</span></div>
        <div class="note-text">${n.comment}</div>
      </div>`;
    }).join('');
    
    // Work experience
    const exps=(c.work_exp||[]).map(e=>`<div class="exp-item">
      <div class="exp-company">${e.company} <span style="font-weight:400;color:#6b7280;font-size:13px">${e.position}</span></div>
      <div class="exp-role">${e.duration}</div>
      <div class="exp-desc">${e.summary}</div>
    </div>`).join('');
    
    const avatarClass=c.gender==='男'?'male':'female';
    document.getElementById('modalBody').innerHTML=`
      <div class="detail-grid">
        <div class="detail-field"><div class="dl">基本信息</div><div class="dv"><span class="candidate-avatar ${avatarClass}" style="display:inline-flex;width:28px;height:28px;font-size:13px;vertical-align:middle;margin-right:6px">${c.name[0]}</span> ${c.name} · ${c.gender} · ${c.age}岁</div></div>
        <div class="detail-field"><div class="dl">学历</div><div class="dv">${c.education} · ${c.school}</div></div>
        <div class="detail-field"><div class="dl">工作经验</div><div class="dv">${c.work_years}年 · ${c.target_position}</div></div>
        <div class="detail-field"><div class="dl">当前阶段</div><div class="dv">${c.stage} · 匹配度 <strong style="color:#4f46e5">${c.score}分</strong></div></div>
        <div class="detail-field"><div class="dl">城市</div><div class="dv">${c.city}</div></div>
        <div class="detail-field"><div class="dl">联系方式</div><div class="dv">${c.phone}</div></div>
        <div class="detail-field"><div class="dl">期望薪资</div><div class="dv">${c.expected_salary}</div></div>
        <div class="detail-field"><div class="dl">到岗时间</div><div class="dv">${c.available_date}</div></div>
      </div>
      <hr class="section-divider">
      <div style="margin-bottom:16px">
        <div style="font-weight:600;font-size:14px;margin-bottom:10px">AI智能总结</div>
        <div class="summary-card"><div class="sc-title">基本信息</div><div class="sc-text">${c.summary.basic}</div></div>
        <div class="summary-card"><div class="sc-title">能力评价</div><div class="sc-text">${c.summary.ability}</div></div>
        <div class="summary-card"><div class="sc-title">额外补充</div><div class="sc-text">${c.summary.extra}</div></div>
      </div>
      <hr class="section-divider">
      <div style="margin-bottom:16px">
        <div style="font-weight:600;font-size:14px;margin-bottom:10px">各维度评分</div>
        ${scoreBars}
      </div>
      <hr class="section-divider">
      <div style="margin-bottom:16px">
        <div style="font-weight:600;font-size:14px;margin-bottom:10px">面试记录</div>
        ${notes||'<p style="color:#6b7280;font-size:13px">暂无面试记录</p>'}
      </div>
      <hr class="section-divider">
      <div>
        <div style="font-weight:600;font-size:14px;margin-bottom:10px">工作经历</div>
        ${exps||'<p style="color:#6b7280;font-size:13px">暂无经历信息</p>'}
      </div>
    `;
    document.getElementById('detailModal').classList.add('show');
    setTimeout(()=>lucide.createIcons(),50);
  }catch(e){console.error('Detail error:',e)}
}

function closeModal(){document.getElementById('detailModal').classList.remove('show')}
document.getElementById('detailModal').addEventListener('click',function(e){if(e.target===this)closeModal()});

// ===== Weights =====
async function loadWeights(){
  const dept=currentDept||'tech';
  try{
    const r=await fetch(`/api/weights/${dept}`);const data=await r.json();
    document.getElementById('deptWeightLabel').textContent=currentDept?`${document.querySelector('.dept-card.'+currentDept+' h3')?.textContent||''} · 拖动滑块调整权重`:'请先选择一个部门';
    
    selectedWeights=JSON.parse(JSON.stringify(data));
    const container=document.getElementById('weightItems');container.innerHTML='';
    Object.entries(data).forEach(([key,w])=>{
      const item=document.createElement('div');item.className='weight-item';
      const pct=Math.round(w.value/sumWeights(data)*100);
      item.innerHTML=`
        <div class="weight-header"><span class="wl">${w.label}</span><span class="wv">${w.value}%</span></div>
        <input type="range" class="weight-slider" min="0" max="${w.max}" value="${w.value}"
          oninput="onWeightChange('${key}',this.value)">
      `;
      container.appendChild(item);
    });
    updateWeightTotal();hasWeightChanges=false;
    document.getElementById('applyWeights').disabled=true;
    document.getElementById('resetWeights').onclick=resetWeights;
  }catch(e){console.error('Weights error:',e)}
}

function sumWeights(w){return Object.values(w).reduce((a,b)=>a+b.value,0)}

function onWeightChange(key,val){
  if(!selectedWeights[key])return;
  selectedWeights[key].value=parseFloat(val);
  // Update display
  const items=document.getElementById('weightItems').querySelectorAll('.weight-item');
  const idx=Object.keys(selectedWeights).indexOf(key);
  if(idx>=0&&items[idx]){
    items[idx].querySelector('.wv').textContent=val+'%';
  }
  updateWeightTotal();hasWeightChanges=true;
  document.getElementById('applyWeights').disabled=false;
}

function updateWeightTotal(){
  const total=sumWeights(selectedWeights);
  const el=document.getElementById('weightTotal');
  el.className='weight-total '+(total===100?'ok':'warn');
  el.textContent=total===100?'✓ 权重之和为100%，已平衡':'⚠ 权重之和为'+total+'%，建议调整为100%';
}

async function applyWeights(){
  const dept=currentDept||'tech';
  try{
    const weights={};
    Object.entries(selectedWeights).forEach(([k,v])=>{weights[k]={value:v.value}});
    const r=await fetch(`/api/weights/${dept}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({weights})
    });
    await r.json();
    hasWeightChanges=false;document.getElementById('applyWeights').disabled=true;
    showToast('权重已应用，评分已实时更新');
    loadCandidates();
  }catch(e){console.error('Apply weights error:',e)}
}

function resetWeights(){
  const dept=currentDept||'tech';
  // Reset to default template weights (from backend)
  const defaults={
    tech:{tech_ability:{value:50},project_exp:{value:30},education:{value:10},soft_skill:{value:10}},
    product:{related_exp:{value:40},soft_skill:{value:30},project_result:{value:20},education:{value:10}},
    market:{industry_exp:{value:40},performance:{value:35},soft_skill:{value:20},education:{value:5}},
  };
  const resetW=defaults[dept]||defaults.tech;
  fetch(`/api/weights/${dept}`,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({weights:resetW})
  }).then(()=>{loadWeights();loadCandidates();showToast('已恢复默认权重')});
}

// ===== Resume Extract =====
async function extractResume(){
  const text=document.getElementById('resumeInput').value.trim();
  if(!text){showToast('请先输入简历文本');return}
  try{
    const r=await fetch('/api/resume/extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
    const data=await r.json();
    const el=document.getElementById('resumeResult');
    el.style.display='block';
    el.innerHTML='<pre>'+JSON.stringify(data,null,2)+'</pre>';
    showToast('简历提取完成');
  }catch(e){console.error('Resume extract error:',e)}
}

// ===== Interview Extract =====
async function extractInterview(){
  const text=document.getElementById('interviewInput').value.trim();
  if(!text){showToast('请先输入面评内容');return}
  try{
    const r=await fetch('/api/interview/extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
    const data=await r.json();
    const el=document.getElementById('interviewResult');
    el.style.display='block';
    el.innerHTML='<pre>'+JSON.stringify(data,null,2)+'</pre>';
    showToast('面评提取完成');
  }catch(e){console.error('Interview extract error:',e)}
}

// ===== Chat =====
function toggleChat(){
  const panel=document.getElementById('chatPanel');const fab=document.getElementById('chatFab');
  panel.classList.toggle('show');
  document.getElementById('chatDot').style.display='none';
}

function addChatMessage(role,text){
  const msgs=document.getElementById('chatMessages');
  const div=document.createElement('div');div.className='chat-msg '+role;
  const avatar=document.createElement('div');avatar.className='avatar';
  avatar.innerHTML=role==='bot'?'<i data-lucide="bot" width="16"></i>':'<i data-lucide="user" width="16"></i>';
  const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;
  div.appendChild(avatar);div.appendChild(bubble);msgs.appendChild(div);
  msgs.scrollTop=msgs.scrollHeight;
  setTimeout(()=>lucide.createIcons(),10);
}

async function sendChat(){
  const input=document.getElementById('chatInput');const msg=input.value.trim();
  if(!msg)return;
  input.value='';
  addChatMessage('user',msg);
  
  // Show loading
  const msgs=document.getElementById('chatMessages');
  const loadingDiv=document.createElement('div');loadingDiv.className='chat-msg bot';
  loadingDiv.innerHTML='<div class="avatar"><i data-lucide="bot" width="16"></i></div><div class="bubble"><span class="loading"></span> 思考中...</div>';
  msgs.appendChild(loadingDiv);msgs.scrollTop=msgs.scrollHeight;
  
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,dept:currentDept})});
    const data=await r.json();
    loadingDiv.remove();
    addChatMessage('bot',data.answer);
    
    // Set suggestions
    const suggestContainer=document.getElementById('chatSuggestion');
    suggestContainer.innerHTML='';
    (data.suggestions||[]).forEach(s=>{
      const btn=document.createElement('button');btn.textContent=s;
      btn.onclick=()=>{document.getElementById('chatInput').value=s;sendChat()};
      suggestContainer.appendChild(btn);
    });
  }catch(e){
    loadingDiv.remove();
    addChatMessage('bot','抱歉，查询出现异常，请稍后重试。');
  }
}

// ===== Init =====
async function init(){
  await loadFunnel();
  await loadDepartments();
  await loadCandidates();
  await loadWeights();
  
  // Header stats
  try{
    const r=await fetch('/api/stats/overview');const s=await r.json();
    document.getElementById('headerStats').textContent=`${s.total_candidates}位候选人 · 平均${s.avg_score}分 · Offer ${s.offer_count}人`;
  }catch(e){}
}
init();
</script>
</body>
</html>
