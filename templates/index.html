<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI智能招聘管理系统</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
/* ===== Reset & Base ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100vh}
a{color:#4f46e5;text-decoration:none}
/* ===== Layout ===== */
.app-header{background:linear-gradient(135deg,#1e1b4b,#312e81);color:#fff;padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(0,0,0,.15);position:sticky;top:0;z-index:100}
.app-header h1{font-size:20px;font-weight:600;display:flex;align-items:center;gap:10px}
.app-header h1 i{color:#a5b4fc}
.header-actions{display:flex;align-items:center;gap:16px}
.header-actions span{font-size:13px;color:#c7d2fe}
.stats-badge{background:rgba(255,255,255,.15);padding:6px 14px;border-radius:20px;font-size:13px}
.app-container{max-width:1400px;margin:0 auto;padding:24px 20px}
.page-section{margin-bottom:28px}
.section-title{font-size:16px;font-weight:600;color:#1a1a2e;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.section-title .badge{background:#e0e7ff;color:#4338ca;font-size:12px;padding:2px 10px;border-radius:12px}
/* ===== Department Cards ===== */
.dept-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-bottom:28px}
.dept-card{background:#fff;border-radius:12px;padding:20px 24px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;transition:all .2s;border:2px solid transparent;position:relative;overflow:hidden}
.dept-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1);transform:translateY(-1px)}
.dept-card.active{border-color:#4f46e5;background:#f8f7ff}
.dept-card .dept-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:12px}
.dept-card.tech .dept-icon{background:#ede9fe;color:#7c3aed}
.dept-card.product .dept-icon{background:#fce7f3;color:#db2777}
.dept-card.market .dept-icon{background:#dbeafe;color:#2563eb}
.dept-card h3{font-size:16px;font-weight:600;margin-bottom:4px}
.dept-card .dept-count{font-size:13px;color:#6b7280;margin-bottom:12px}
.dept-stats{display:flex;gap:16px;flex-wrap:wrap}
.dept-stat{display:flex;align-items:center;gap:6px;font-size:13px;color:#374151}
.dept-stat strong{font-size:18px;color:#1a1a2e;font-weight:700}
.dept-stat .label{color:#6b7280;font-size:12px}
.dept-card .active-indicator{position:absolute;top:0;left:0;width:4px;height:100%;background:#4f46e5;display:none}
.dept-card.active .active-indicator{display:block}
.dept-card .arrow{position:absolute;right:16px;top:20px;color:#c7cbd1;font-size:18px}
/* ===== Main Content Layout ===== */
.main-content{display:grid;grid-template-columns:1fr 320px;gap:20px}
@media(max-width:1024px){.main-content{grid-template-columns:1fr}}
/* ===== Candidate List ===== */
.candidate-list{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden}
.list-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #e5e7eb;flex-wrap:wrap;gap:12px}
.list-header .left{display:flex;align-items:center;gap:12px}
.list-header .left h2{font-size:16px;font-weight:600}
.list-filters{display:flex;gap:8px;flex-wrap:wrap}
.list-filters select,.list-filters input{padding:6px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;background:#fff;outline:none}
.list-filters select:focus,.list-filters input:focus{border-color:#4f46e5;box-shadow:0 0 0 2px rgba(79,70,229,.1)}
.candidate-item{display:flex;align-items:center;padding:14px 20px;border-bottom:1px solid #f3f4f6;cursor:pointer;transition:background .15s;gap:14px}
.candidate-item:hover{background:#f9fafb}
.candidate-item:last-child{border-bottom:none}
.candidate-avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;flex-shrink:0;color:#fff}
.candidate-avatar.male{background:linear-gradient(135deg,#6366f1,#818cf8)}
.candidate-avatar.female{background:linear-gradient(135deg,#ec4899,#f472b6)}
.candidate-info{flex:1;min-width:0}
.candidate-info .name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.candidate-info .name .stage-tag{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500}
.stage-tag.resume{background:#fef3c7;color:#92400e}
.stage-tag.first{background:#dbeafe;color:#1e40af}
.stage-tag.second{background:#ede9fe;color:#5b21b6}
.stage-tag.final{background:#fce7f3;color:#9d174d}
.stage-tag.offer{background:#d1fae5;color:#065f46}
.candidate-info .sub{font-size:12px;color:#6b7280;margin-top:2px}
.candidate-tags{display:flex;gap:4px;flex-wrap:wrap}
.candidate-tags .tag{font-size:11px;background:#f3f4f6;color:#4b5563;padding:2px 8px;border-radius:4px}
.candidate-score{text-align:center;min-width:56px}
.candidate-score .num{font-size:18px;font-weight:700}
.candidate-score .num.high{color:#059669}
.candidate-score .num.mid{color:#d97706}
.candidate-score .num.low{color:#dc2626}
.candidate-score .lbl{font-size:11px;color:#6b7280}
/* ===== Empty State ===== */
.empty-state{text-align:center;padding:48px 20px;color:#6b7280}
.empty-state i{font-size:48px;color:#d1d5db;margin-bottom:12px}
.empty-state p{font-size:14px}
/* ===== Weights Panel ===== */
.weights-panel{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:20px;position:sticky;top:88px}
.weights-panel h3{font-size:15px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.weights-panel .sub{font-size:12px;color:#6b7280;margin-bottom:16px}
.weight-item{margin-bottom:16px}
.weight-header{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.weight-header .wl{color:#374151}
.weight-header .wv{font-weight:600;color:#4f46e5}
.weight-slider{width:100%;-webkit-appearance:none;height:6px;border-radius:3px;background:#e5e7eb;outline:none}
.weight-slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#4f46e5;cursor:pointer;box-shadow:0 1px 4px rgba(79,70,229,.3)}
.weight-slider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#4f46e5;cursor:pointer;border:none}
.weight-total{text-align:center;padding:12px;border-radius:8px;margin:12px 0;font-size:13px}
.weight-total.ok{background:#f0fdf4;color:#166534}
.weight-total.warn{background:#fef2f2;color:#991b1b}
.btn-apply{width:100%;padding:10px;border:none;border-radius:8px;background:#4f46e5;color:#fff;font-size:14px;font-weight:500;cursor:pointer;transition:background .2s}
.btn-apply:hover{background:#4338ca}
.btn-apply:disabled{background:#9ca3af;cursor:not-allowed}</head>
<body>
<header class="app-header"><h1>AI智能招聘管理系统</h1><div class="header-actions"><span class="stats-badge" id="headerStats">加载中...</span></div></header>
<div class="app-container">
<div class="tools-row"><div class="tool-card"><h3>简历智能提取</h3><textarea id="resumeInput" placeholder="粘贴简历文本..."></textarea><button class="btn-tool" onclick="extractResume()">AI提取</button><div class="tool-result" id="resumeResult" style="display:none"></div></div><div class="tool-card"><h3>面评智能提取</h3><textarea id="interviewInput" placeholder="粘贴面试官面评..."></textarea><button class="btn-tool" onclick="extractInterview()">AI提取</button><div class="tool-result" id="interviewResult" style="display:none"></div></div></div>
<div class="funnel-section"><div class="section-title">招聘漏斗</div><div class="funnel-container" id="funnelChart"></div></div>
<div class="page-section"><div class="section-title">部门总览地图</div><div class="dept-grid" id="deptGrid"></div></div>
<div class="main-content"><div class="candidate-list"><div class="list-header"><div class="left"><h2><span id="listTitle">全部候选人</span></h2><span class="badge" id="candidateCount">0人</span></div><div class="list-filters"><input type="text" placeholder="搜索..." id="searchInput" oninput="debouncedLoad()" style="width:140px"><select id="stageFilter" onchange="loadCandidates()"><option value="">全部</option><option value="简历初筛">简历初筛</option><option value="初试">初试</option><option value="复试">复试</option><option value="终面">终面</option><option value="offer">Offer</option></select><select id="sortBy" onchange="loadCandidates()"><option value="score_desc">匹配度降序</option><option value="score_asc">匹配度升序</option></select></div></div><div id="candidateItems"></div></div>
<div class="weights-panel" id="weightsPanel"><h3>评分权重调节</h3><p class="sub" id="deptWeightLabel">选择部门查看权重</p><div id="weightItems"></div><div class="weight-total" id="weightTotal"></div><button class="btn-apply" id="applyWeights" onclick="applyWeights()" disabled>应用权重</button></div></div></div>
<div class="modal-overlay" id="detailModal"><div class="modal-content"><div class="modal-header"><h2><span id="modalName">候选人详情</span></h2><button class="modal-close" onclick="closeModal()">x</button></div><div class="modal-body" id="modalBody"></div></div></div>
<button class="chat-fab" id="chatFab" onclick="toggleChat()">AI助手</button>
<div class="chat-panel" id="chatPanel"><div class="chat-header"><h3>AI招聘助手</h3><button class="chat-close" onclick="toggleChat()">x</button></div><div class="chat-messages" id="chatMessages"></div><div class="chat-input-wrap"><input type="text" id="chatInput" placeholder="输入问题..." onkeydown="sd(event)"><button onclick="sd(event)">发送</button></div></div>
<script>
let currentDept=null,selectedWeights={};
function showToast(m){const t=document.getElementById("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2500)}
let dt;function debouncedLoad(){clearTimeout(dt);dt=setTimeout(loadCandidates,300)}
function sd(e){if(e&&e.key&&e.key!=="Enter")return;const i=document.getElementById("chatInput");const msg=i.value.trim();if(!msg)return;i.value="";loadChat(msg)}
async function loadDepartments(){const r=await fetch("/api/departments/overview");const d=await r.json();const g=document.getElementById("deptGrid");g.innerHTML="";Object.entries(d).forEach(([id,dept])=>{const card=document.createElement("div");card.className="dept-card "+id;card.innerHTML="<h3>"+dept.name+"</h3><p>投递"+dept.total+"人 平均"+dept.avg_score+"分 通过终面"+dept.passed_count+"人</p>";card.onclick=()=>{currentDept=currentDept===id?null:id;loadDepartments();loadCandidates();loadWeights()};g.appendChild(card)});lucide.createIcons()}
async function loadCandidates(){const p=new URLSearchParams();if(currentDept)p.set("dept",currentDept);const r=await fetch("/api/candidates?"+p);const d=await r.json();const c=document.getElementById("candidateItems");document.getElementById("candidateCount").textContent=d.length+"人";let h="";d.forEach(cd=>{h+="<div class=candidate-item onclick=openDetail("+cd.id+")><div>"+cd.name+" "+cd.target_position+" "+cd.score+"分 "+cd.stage+"</div></div>"});c.innerHTML=h}
async function openDetail(id){const r=await fetch("/api/candidates/"+id);const c=await r.json();document.getElementById("modalName").textContent=c.name;document.getElementById("modalBody").innerHTML="<p><b>基本信息</b><br>"+c.summary.basic+"</p><p><b>能力评价</b><br>"+c.summary.ability+"</p><p><b>额外补充</b><br>"+c.summary.extra+"</p>";document.getElementById("detailModal").classList.add("show")}
function closeModal(){document.getElementById("detailModal").classList.remove("show")}
async function loadWeights(){const dept=currentDept||"tech";const r=await fetch("/api/weights/"+dept);const d=await r.json();selectedWeights=d;const c=document.getElementById("weightItems");c.innerHTML="";let tot=0;Object.entries(d).forEach(([k,w])=>{tot+=w.value;c.innerHTML+="<div><span>"+w.label+"</span><input type=range min=0 max=100 value="+w.value+" oninput=onWeightChange()></div>"})}
async function applyWeights(){const dept=currentDept||"tech";const weights={};Object.entries(selectedWeights).forEach(([k,v])=>{weights[k]={value:v.value}});await fetch("/api/weights/"+dept,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({weights})});showToast("权重已应用");loadCandidates()}
async function extractResume(){const t=document.getElementById("resumeInput").value.trim();if(!t)return;const r=await fetch("/api/resume/extract",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t})});const d=await r.json();const e=document.getElementById("resumeResult");e.style.display="block";e.innerHTML="<pre>"+JSON.stringify(d,null,2)+"</pre>"}
async function extractInterview(){const t=document.getElementById("interviewInput").value.trim();if(!t)return;const r=await fetch("/api/interview/extract",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t})});const d=await r.json();const e=document.getElementById("interviewResult");e.style.display="block";e.innerHTML="<pre>"+JSON.stringify(d,null,2)+"</pre>"}
function toggleChat(){document.getElementById("chatPanel").classList.toggle("show")}
async function loadChat(msg){const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:msg,dept:currentDept})});const d=await r.json();const m=document.getElementById("chatMessages");m.innerHTML+="<div>用户: "+msg+"</div><div>AI: "+d.answer+"</div>";m.scrollTop=m.scrollHeight}
window.onload=function(){loadDepartments();loadCandidates();loadWeights();fetch("/api/stats/overview").then(r=>r.json()).then(s=>{document.getElementById("headerStats").textContent=s.total_candidates+"位候选人 平均"+s.avg_score+"分 Offer "+s.offer_count+"人"}).catch(()=>{})}
</script>
</body>
</html>
