<style>*,::before,::after{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f0f2f5;color:#1a1a2e}.app-header{background:linear-gradient(135deg,#1e1b4b,#312e81);color:#fff;padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}.app-header h1{font-size:20px;font-weight:600;display:flex;align-items:center;gap:10px;color:#fff}.stats-badge{background:rgba(255,255,255,.15);padding:6px 14px;border-radius:20px;font-size:13px;color:#c7d2fe}.app-container{max-width:1400px;margin:0 auto;padding:24px 20px}.section-title{font-size:16px;font-weight:600;color:#1a1a2e;margin-bottom:16px;display:flex;align-items:center;gap:8px}.section-title .badge{background:#e0e7ff;color:#4338ca;font-size:12px;padding:2px 10px;border-radius:12px}.dept-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-bottom:28px}.dept-card{background:#fff;border-radius:12px;padding:20px 24px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;transition:all .2s;border:2px solid transparent;position:relative;overflow:hidden}.dept-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1);transform:translateY(-1px)}.dept-card.active{border-color:#4f46e5;background:#f8f7ff}.dept-card .dept-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:12px}.dept-card.tech .dept-icon{background:#ede9fe;color:#7c3aed}.dept-card.product .dept-icon{background:#fce7f3;color:#db2777}.dept-card.market .dept-icon{background:#dbeafe;color:#2563eb}.dept-card h3{font-size:16px;font-weight:600;margin-bottom:4px}.dept-card .dept-count{font-size:13px;color:#6b7280;margin-bottom:12px}.dept-stats{display:flex;gap:16px;flex-wrap:wrap}.dept-stat{display:flex;align-items:center;gap:6px;font-size:13px;color:#374151}.dept-stat strong{font-size:18px;color:#1a1a2e;font-we 11px;background:#f3f4f6;color:#4b5563;padding:2px 8px;border-radius:4px}.candidate-score{text-align:center;min-width:56px}.candidate-score .num{font-size:18px;font-weight:700}.num.high{color:#059669}.num.mid{color:#d97706}.num.low{color:#dc2626}.candidate-score .lbl{font-size:11px;color:#6b7280}.empty-state{text-align:center;padding:48px 20px;color:#6b7280}.weights-panel{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:20px;position:sticky;top:88px}.weights-panel h3{font-size:15px;font-weight:600;margin-bottom:4px}.weights-panel .sub{font-size:12px;color:#6b7280;margin-bottom:16px}.weight-item{margin-bottom:16px}.weight-header{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}.weight-header .wl{color:#374151}.weight-header .wv{font-weight:600;color:#4f46e5}.weight-slider{width:100%;-webkit-appearance:none;height:6px;border-radius:3px;background:#e5e7eb;outline:none}.weight-slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#4f46e5;cursor:pointer}.weight-total{text-align:center;padding:12px;border-radius:8px;margin:12px 0;font-size:13px}.weight-total.ok{background:#f0fdf4;color:#166534}.weight-total.warn{background:#fef2f2;color:#991b1b}.btn-apply{width:100%;padding:10px;border:none;border-radius:8px;background:#4f46e5;color:#fff;font-size:14px;font-weight:500;cursor:pointer;transition:background .2s}.btn-apply:hover{background:#4338ca}.btn-apply:disabled{background:#9ca3af;cursor:not-allowed}.btn-reset{width:100%;padding:8px;border:1px solid #d1d5db;border-radius:8px;background:transparent;color:#6b7280;font-size:13px;cursor:pointer;margin-top:8px;transition:all .2s}.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}.modal-overlay.show{display:flex}.modal-content{background:#fff;border-radius:16px;width:100%;max-width:720px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid #e5e7eb;position:sticky;top:0;background:#fff}.modal-close{width:32px;height:32px;border:none;background:#f3f4f6;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#6b7280;transition:all .2s}.modal-close:hover{background:#e5e7eb;color:#1a1a2e}.modal-body{padding:24px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}@media(max-width:600px){.detail-grid{grid-template-columns:1fr}}.detail-field .dl{font-size:12px;color:#6b7280;margin-bottom:2px}.detail-field .dv{font-size:14px;font-weight:500;color:#1a1a2e}.sd{border:none;border-top:1px solid #e5e7eb;margin:16px 0}.st{font-weight:600;font-size:14px;margin-bottom:10px}.summary-card{background:#f8f7ff;border-radius:10px;padding:16px;margin-bottom:12px;border-left:4px solid #4f46e5}.summary-card .sc-title{font-size:13px;font-weight:600;color:#4338ca;margin-bottom:6px}.summary-card .sc-text{font-size:13px;color:#374151;line-height:1.7}.score-bar-item{display:flex;align-items:center;gap:10px;margin-bottom:8px}.score-bar-item .sbl{font-size:13px;color:#374151;width:80px;flex-shrink:0;text-align:right}.score-bar-item .sbb{flex:1;height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden}.score-bar-item .sbb .fill{height:100%;border-radius:4px;transition:width .4s ease}.score-bar-item .sbv{font-size:13px;font-weight:600;width:60px;text-align:right}.interview-note{background:#f9fafb;border-radius:8px;padding:12px 16px;margin-bottom:8px;border-left:3px solid #6366f1}.interview-note .note-header{display:flex;justify-content:space-between;font-size:12px;color:#6b7280;margin-bottom:4px}.interview-note .note-text{font-size:13px;color:#374151;line-height:1.6}.exp-item{margin-bottom:12px;padding:12px;background:#f9fafb;border-radius:8px}.exp-item .exp-company{font-weight:600;font-size:14px}.chat-fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border:none;cursor:pointer;box-shadow:0 4px 16px rgba(79,70,229,.35);display:flex;align-items:center;justify-content:center;z-index:150;transition:all .25s;font-size:24px}.chat-fab:hover{transform:scale(1.08)}.chat-panel{position:fixed;bottom:90px;right:24px;width:380px;max-height:540px;background:#fff;border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,.18);z-index:149;display:none;flex-direction:column;overflow:hidden}.chat-panel.show{display:flex}.chat-header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}.chat-header h3{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}.chat-messages{flex:1;overflow-y:auto;padding:14px 16px;min-height:200px;max-height:340px;background:#f8f9fb}.chat-msg{margin-bottom:12px;display:flex;gap:8px}.chat-msg.user{flex-direction:row-reverse}.chat-msg .bubble{max-width:85%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.6;white-space:pre-wrap}.chat-msg.bot .bubble{background:#fff;color:#1a1a2e;box-shadow:0 1px 4px rgba(0,0,0,.06)}.chat-msg.user .bubble{background:#4f46e5;color:#fff}.chat-msg .avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}.chat-msg.bot .avatar{background:#e0e7ff;color:#4338ca}.chat-msg.user .avatar{background:#c7d2fe;color:#3730a3}.chat-suggestions{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px;border-top:1px solid #e5e7eb}.chat-suggestions button{font-size:12px;padding:4px 12px;border:1px solid #d1d5db;border-radius:14px;background:#fff;color:#4b5563;cursor:pointer}.chat-suggestions button:hover{background:#f3f4f6;border-color:#9ca3af}.chat-input-wrap{display:flex;padding:10px 14px;border-top:1px solid #e5e7eb;gap:8px;background:#fff}.chat-input-wrap input{flex:1;padding:8px 14px;border:1px solid #d1d5db;border-radius:20px;outline:none;font-size:13px}.chat-input-wrap button{width:36px;height:36px;border-radius:50%;border:none;background:#4f46e5;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}.tools-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px}@media(max-width:768px){.tools-row{grid-template-columns:1fr}}.tool-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}.tool-card h3{font-size:14px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px}.tool-card textarea{width:100%;min-height:80px;padding:10px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;resize:vertical;outline:none;font-family:inherit}.tool-card .btn-tool{margin-top:8px;padding:8px 18px;border:none;border-radius:6px;background:#4f46e5;color:#fff;font-size:13px;cursor:pointer}.tool-result{background:#f9fafb;border-radius:8px;padding:12px;margin-top:10px;font-size:13px;max-height:200px;overflow-y:auto;display:none}.tool-result pre{margin:0;white-space:pre-wrap}.funnel-section{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:28px}.funnel-container{display:flex;align-items:flex-end;gap:12px;padding:12px 0;height:160px}.funnel-bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}.funnel-bar .bar{width:100%;max-width:100px;border-radius:6px 6px 0 0;transition:height .5s ease;min-height:4px}.funnel-bar .bar-label{font-size:12px;color:#6b7280;text-align:center}.funnel-bar .bar-value{font-size:14px;font-weight:700}.toast{position:fixed;top:80px;right:24px;z-index:300;background:#065f46;color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.15);display:none;align-items:center;gap:8px}.toast.show{display:flex}@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}</style></head>
<body>
<header class="app-header"><h1><i data-lucide="brain-circuit"></i> AI智能招聘管理系统</h1><div class="header-actions"><span class="stats-badge" id="headerStats">加载中...</span></div></header>
<div class="app-container">
<div class="tools-row">
<div class="tool-card"><h3><i data-lucide="file-text" style="color:#7c3aed"></i> 简历智能提取</h3><textarea id="resumeInput" placeholder="粘贴简历文本..."></textarea><button class="btn-tool" onclick="er()"><i data-lucide="wand-2" width="14"></i> AI提取</button><div class="tool-result" id="resumeResult"></div></div>
<div class="tool-card"><h3><i data-lucide="message-square" style="color:#db2777"></i> 面评智能提取</h3><textarea id="interviewInput" placeholder="粘贴面评内容..."></textarea><button class="btn-tool" onclick="ei()"><i data-lucide="wand-2" width="14"></i> AI提取</button><div class="tool-result" id="interviewResult"></div></div></div>
<div class="funnel-section"><div class="section-title"><i data-lucide="funnel" width="18"></i> 招聘漏斗 <span class="badge" id="funnelBadge"></span></div><div class="funnel-container" id="funnelChart"></div></div>
<div class="page-section"><div class="section-title"><i data-lucide="layout-dashboard" width="18"></i> 部门总览地图</div><div class="dept-grid" id="deptGrid"></div></div>
<div class="main-content">
<div class="candidate-list">
<div class="list-header"><div class="left"><h2><i data-lucide="users" width="18"></i> <span id="listTitle">全部候选人</span></h2><span class="badge" id="candidateCount">0人</span></div>
<div class="list-filters"><input type="text" placeholder="搜索姓名/职位..." id="searchInput" oninput="dl()" style="width:160px">
<select id="stageFilter" onchange="lc()"><option value="">全部阶段</option><option value="简历初筛">简历初筛</option><option value="初试">初试</option><option value="复试">复试</option><option value="终面">终面</option><option value="offer">Offer</option></select>
<select id="sortBy" onchange="lc()"><option value="score_desc">匹配度↓</option><option value="score_asc">匹配度↑</option></select></div></div>
<div id="candidateItems"><div class="empty-state"><p>加载中...</p></div></div></div>
<div class="weights-panel"><h3><i data-lucide="sliders-horizontal" width="16"></i> 评分权重调节</h3><p class="sub" id="deptWeightLabel">选择部门查看权重</p><div id="weightItems"></div><div class="weight-total" id="weightTotal"></div><button class="btn-apply" id="applyWeights" onclick="aw()" disabled>应用权重</button><button class="btn-reset" onclick="rw()">恢复默认</button></div></div></div>
<div class="modal-overlay" id="detailModal"><div class="modal-content"><div class="modal-header"><h2><i data-lucide="user" width="20"></i> <span id="modalName">候选人详情</span></h2><button class="modal-close" onclick="cm()"><i data-lucide="x" width="18"></i></button></div><div class="modal-body" id="modalBody"></div></div></div>
<button class="chat-fab" id="chatFab" onclick="tc()"><i data-lucide="bot" width="26"></i></button>
<div class="chat-panel"><div class="chat-header"><h3><i data-lucide="bot" width="18"></i> AI招聘助手</h3><button class="chat-close" onclick="tc()"><i data-lucide="x" width="18"></i></button></div><div class="chat-messages"><div class="chat-msg bot"><div class="avatar"><i data-lucide="bot" width="16"></i></div><div class="bubble">你好！我是AI招聘助手。</div></div></div><div class="chat-suggestions" id="chatSuggestion"></div><div class="chat-input-wrap"><input type="text" id="chatInput" placeholder="输入问题..." onkeydown="if(event.key==='Enter')sendChat()"><button onclick="sendChat()"><i data-lucide="send" width="16"></i></button></div></div>
<div class="toast"><i data-lucide="check-circle" width="18"></i> <span id="toastMsg"></span></div>
<script>
lucide.createIcons();
var cd=null,sw={},dbt;
function st(m){var t=document.getElementById('toast');document.getElementById('toastMsg').textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2500)}
function dl(){clearTimeout(dbt);dbt=setTimeout(lc,300)}
async function lf(){try{var r=await fetch('/api/stats/funnel');var d=await r.json();var c=document.getElementById('funnelChart');c.innerHTML='';var mx=1;d.forEach(function(x){mx=Math.max(mx,x.count)});document.getElementById('funnelBadge').textContent=d.reduce(function(a,b){return a+b.count},0)+'人';var cl=['#93c5fd','#818cf8','#a78bfa','#f472b6','#34d399'];d.forEach(function(x,i){var dv=document.createElement('div');dv.className='funnel-bar';var br=document.createElement('div');br.className='bar';br.style.height=Math.max(x.count/mx*100,8)+'%';br.style.background=cl[i]||'#93c5fd';var vl=document.createElement('div');vl.className='bar-value';vl.textContent=x.count;var lb=document.createElement('div');lb.className='bar-label';lb.textContent=x.stage;dv.appendChild(vl);dv.appendChild(br);dv.appendChild(lb);c.appendChild(dv)})}catch(e){}}
async function ld(){try{var r=await fetch('/api/departments/overview');var d=await r.json();var g=document.getElementById('deptGrid');g.innerHTML='';Object.keys(d).forEach(function(k){var dept=d[k];var card=document.createElement('div');card.className='dept-card '+k+(cd===k?' active':'');card.onclick=function(){cd=cd===k?null:k;ld();lc();lw()};var im={tech:'laptop',product:'pie-chart',market:'trending-up'};var sh='';Object.keys(dept.stages).forEach(function(sk){sh+='<span class="dept-stat"><strong>'+dept.stages[sk]+'</strong><span class="label">'+sk+'</span></span>'});card.innerHTML='<div class="active-indicator"></div><div class="dept-icon"><i data-lucide="'+im[k]+'" width="22"></i></div><h3>'+dept.name+'</h3><div class="dept-count">'+dept.total+'人 · 平均'+dept.avg_score+'分</div><div class="dept-stats">'+sh+'</div>';g.appendChild(card)});lucide.createIcons()}catch(e){}}
async function lc(){try{var p=new URLSearchParams();if(cd)p.set('dept',cd);var r=await fetch('/api/candidates?'+p);var d=await r.json();var c=document.getElementById('candidateItems');document.getElementById('candidateCount').textContent=d.length+'人';if(d.length===0){c.innerHTML='<div class="empty-state"><p>暂无候选人</p></div>';return}var h='';d.forEach(function(x){var sc=x.score>=85?'high':x.score>=70?'mid':'low';var si=x.stage==='简历初筛'?0:x.stage==='初试'?1:x.stage==='复试'?2:x.stage==='终面'?3:4;h+='<div class="candidate-item" onclick="od('+x.id+')"><div class="candidate-avatar '+(x.gender==='男'?'male':'female')+'">'+x.name[0]+'</div><div class="candidate-info"><div class="name">'+x.name+' '+x.age+'岁 · '+x.education+' <span class="stage-tag r'+si+'">'+x.stage+'</span></div><div class="sub">'+x.target_position+' · '+x.dept_name+'</div><div class="candidate-tags">'+x.skills.map(function(s){return '<span class="tag">'+s+'</span>'}).join('')+'</div></div><div class="candidate-score"><div class="num '+sc+'">'+x.score+'</div><div class="lbl">匹配度</div></div></div>'});c.innerHTML=h;lucide.createIcons()}catch(e){}}
async function od(id){try{var r=await fetch('/api/candidates/'+id);var c=await r.json();document.getElementById('modalName').textContent=c.name;var sb='';if(c.score_detail){Object.keys(c.score_detail).forEach(function(l){var d=c.score_detail[l];var pct=Math.min(d.score,100);var col=d.score>=85?'#059669':d.score>=70?'#d97706':'#dc2626';sb+='<div class="score-bar-item"><span class="sbl">'+l+'</span><div class="sbb"><div class="fill" style="width:'+pct+'%;background:'+col+'"></div></div><span class="sbv" style="color:'+col+'">'+d.score+'分</span></div>'})}var nt='';(c.interview_notes||[]).forEach(function(n){nt+='<div class="interview-note"><div class="note-header"><span>'+n.round+' · '+n.interviewer+'</span></div><div class="note-text">'+n.comment+'</div></div>'});document.getElementById('modalBody').innerHTML='<div class="detail-grid"><div class="detail-field"><div class="dl">姓名</div><div class="dv">'+c.name+' · '+c.gender+' · '+c.age+'岁</div></div><div class="detail-field"><div class="dl">学历</div><div class="dv">'+c.education+' · '+c.school+'</div></div><div class="detail-field"><div class="dl">工作经验</div><div class="dv">'+c.work_years+'年</div></div><div class="detail-field"><div class="dl">当前阶段</div><div class="dv">'+c.stage+' · 匹配度 <strong style="color:#4f46e5">'+c.score+'分</strong></div></div><div class="detail-field"><div class="dl">城市</div><div class="dv">'+c.city+'</div></div><div class="detail-field"><div class="dl">期望薪资</div><div class="dv">'+(c.expected_salary||'-')+'</div></div></div><hr class="sd"><div class="st">AI智能总结</div><div class="summary-card"><div class="sc-title">基本信息</div><div class="sc-text">'+(c.summary?c.summary.basic:'')+'</div></div><div class="summary-card"><div class="sc-title">能力评价</div><div class="sc-text">'+(c.summary?c.summary.ability:'')+'</div></div><div class="summary-card"><div class="sc-title">额外补充</div><div class="sc-text">'+(c.summary?c.summary.extra:'')+'</div></div><hr class="sd"><div class="st">各维度评分</div>'+sb+'<hr class="sd"><div class="st">面试记录</div>'+(nt||'<p style="color:#6b7280">暂无</p>')+'</div>';document.getElementById('detailModal').classList.add('show');setTimeout(function(){lucide.createIcons()},50)}catch(e){}}
function cm(){document.getElementById('detailModal').classList.remove('show')}
document.getElementById('detailModal').onclick=function(e){if(e.target===this)cm()}
async function lw(){var d=cd||'tech';try{var r=await fetch('/api/weights/'+d);var dt=await r.json();sw=JSON.parse(JSON.stringify(dt));document.getElementById('deptWeightLabel').textContent=cd?'拖动滑块调节':'请先选择部门';var c=document.getElementById('weightItems');c.innerHTML='';Object.keys(dt).forEach(function(k){c.innerHTML+='<div class="weight-item"><div class="weight-header"><span class="wl">'+dt[k].label+'</span><span class="wv">'+dt[k].value+'%</span></div><input type="range" class="weight-slider" min="0" max="100" value="'+dt[k].value+'" oninput="owc(\''+k+'\',this.value)"></div>'});uwt();document.getElementById('applyWeights').disabled=true}catch(e){}}
function swt(w){var t=0;for(var k in w)t+=w[k].value;return t}
function uwt(){var t=swt(sw);var el=document.getElementById('weightTotal');el.className='weight-total '+(t===100?'ok':'warn');el.textContent=t===100?'✓ 权重之和为100%':'⚠ 权重之和为'+t+'%'}
function owc(k,v){if(!sw[k])return;sw[k].value=parseFloat(v);var items=document.getElementById('weightItems').querySelectorAll('.weight-item');var idx=Object.keys(sw).indexOf(k);if(idx>=0&&items[idx])items[idx].querySelector('.wv').textContent=v+'%';uwt();document.getElementById('applyWeights').disabled=false}
async function aw(){var de=cd||'tech';var w={};Object.keys(sw).forEach(function(k){w[k]={value:sw[k].value}});await fetch('/api/weights/'+de,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({weights:w})});document.getElementById('applyWeights').disabled=true;st('权重已应用');lc()}
function rw(){var de=cd||'tech';var def={tech:{tech_ability:{value:50},project_exp:{value:30},education:{value:10},soft_skill:{value:10}},product:{related_exp:{value:40},soft_skill:{value:30},project_result:{value:20},education:{value:10}},market:{industry_exp:{value:40},performance:{value:35},soft_skill:{value:20},education:{value:5}}};fetch('/api/weights/'+de,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({weights:def[de]||def.tech})}).then(function(){lw();lc();st('已恢复默认权重')})}
async function er(){var t=document.getElementById('resumeInput').value.trim();if(!t)return;var r=await fetch('/api/resume/extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});var d=await r.json();var e=document.getElementById('resumeResult');e.style.display='block';e.innerHTML='<pre>'+JSON.stringify(d,null,2)+'</pre>'}
async function ei(){var t=document.getElementById('interviewInput').value.trim();if(!t)return;var r=await fetch('/api/interview/extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});var d=await r.json();var e=document.getElementById('interviewResult');e.style.display='block';e.innerHTML='<pre>'+JSON.stringify(d,null,2)+'</pre>'}
function tc(){document.getElementById('chatPanel').classList.toggle('show')}
function ac(r,t){var m=document.getElementById('chatMessages');var d=document.createElement('div');d.className='chat-msg '+r;var a=document.createElement('div');a.className='avatar';a.innerHTML=r==='bot'?'<i data-lucide="bot" width="16"></i>':'<i data-lucide="user" width="16"></i>';var b=document.createElement('div');b.className='bubble';b.textContent=t;d.appendChild(a);d.appendChild(b);m.appendChild(d);m.scrollTop=m.scrollHeight}
async function sendChat(){var i=document.getElementById('chatInput');var msg=i.value.trim();if(!msg)return;i.value='';ac('user',msg);try{var r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,dept:cd})});var d=await r.json();ac('bot',d.answer);var sg=document.getElementById('chatSuggestion');sg.innerHTML='';(d.suggestions||[]).forEach(function(s){var btn=document.createElement('button');btn.textContent=s;btn.onclick=function(){document.getElementById('chatInput').value=s;sendChat()};sg.appendChild(btn)})}catch(e){ac('bot','查询异常')}}
async function init(){await lf();await ld();await lc();await lw();try{var r=await fetch('/api/stats/overview');var s=await r.json();document.getElementById('headerStats').textContent=s.total_candidates+'位候选人 · 平均'+s.avg_score+'分 · Offer '+s.offer_count+'人'}catch(e){}}
init();
</script>
</body></html>
